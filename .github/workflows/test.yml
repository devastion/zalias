---
name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  shellspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install zsh and git
        run: sudo apt-get update && sudo apt-get install -y zsh git
      - name: Syntax check
        run: |
          for f in zalias.plugin.zsh _zalias functions/*; do
            zsh -n "$f"
          done
      - name: Install ShellSpec
        run: |
          git clone --depth 1 --branch 0.28.1 \
            https://github.com/shellspec/shellspec.git "$HOME/shellspec"
      - name: Run tests
        run: |
          "$HOME/shellspec/shellspec"
